<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details Page</title>
    <style>
        /* Global Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Product Layout (Two-Column Desktop) */
        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: #ffffff;
            max-width: 1000px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Product Image Section */
        .product-image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            border-radius: 8px;
            overflow: hidden;
            padding: 20px;
        }

        .main-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .main-image:hover {
            transform: scale(1.03);
        }

        /* Product Details Section */
        .product-details-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 28px;
            font-weight: 700;
            color: #111;
            margin-bottom: 10px;
        }

        /* Rating Styles */
        .product-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .stars {
            color: #f59e0b;
            font-size: 16px;
        }

        .rating-count {
            font-size: 14px;
            color: #666;
        }

        /* Pricing Section */
        .product-pricing {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .current-price {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .previous-price {
            font-size: 16px;
            color: #9ca3af;
            text-decoration: line-through;
        }

        .discount-badge {
            background-color: #fee2e2;
            color: #dc2626;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Description */
        .product-description {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Options Group */
        .option-group {
            margin-bottom: 20px;
        }

        .option-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        /* Size Options Style */
        .size-options {
            display: flex;
            gap: 10px;
        }

        .size-btn {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .size-btn:hover, .size-btn.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #2563eb;
        }

        /* Color Options Style */
        .color-options {
            display: flex;
            gap: 12px;
        }

        .color-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-circle:hover {
            transform: scale(1.1);
        }

        .color-circle.active {
            border-color: #2563eb;
        }

        /* Quantity Selector Style */
        .quantity-selector {
            display: inline-flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
        }

        .qty-btn {
            background: #f3f4f6;
            border: none;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: #e5e7eb;
        }

        .qty-input {
            width: 45px;
            text-align: center;
            border: none;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        /* Action Buttons */
        .product-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .add-to-cart {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .add-to-cart:hover {
            background-color: #e5e7eb;
        }

        .buy-now {
            background-color: #2563eb;
            color: #ffffff;
        }

        .buy-now:hover {
            background-color: #1d4ed8;
        }

        /* Responsive Layout (Mobile Stack) */
        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }
            
            .product-title {
                font-size: 22px;
            }

            .product-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="product-container">
        <!-- Product Image -->
        <div class="product-image-section">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Classic Running Shoe" class="main-image">
        </div>

        <!-- Product Information & Controls -->
        <div class="product-details-section">
            <div>
                <h1 class="product-title">Velocity Pro Running Shoe</h1>
                
                <div class="product-rating">
                    <span class="stars">★★★★☆</span>
                    <span class="rating-count">(128 reviews)</span>
                </div>

                <div class="product-pricing">
                    <span class="current-price">$129.99</span>
                    <span class="previous-price">$169.99</span>
                    <span class="discount-badge">23% OFF</span>
                </div>

                <p class="product-description">
                    Engineered for peak performance and ultimate everyday comfort. Featuring breathable mesh, responsive cushioning, and a durable traction sole to keep you moving effortlessly.
                </p>

                <!-- Size Options -->
                <div class="option-group">
                    <span class="option-label">Select Size</span>
                    <div class="size-options">
                        <button class="size-btn">US 8</button>
                        <button class="size-btn active">US 9</button>
                        <button class="size-btn">US 10</button>
                        <button class="size-btn">US 11</button>
                    </div>
                </div>

                <!-- Color Options -->
                <div class="option-group">
                    <span class="option-label">Select Color</span>
                    <div class="color-options">
                        <div class="color-circle active" style="background-color: #dc2626;" title="Red"></div>
                        <div class="color-circle" style="background-color: #111827;" title="Black"></div>
                        <div class="color-circle" style="background-color: #2563eb;" title="Blue"></div>
                    </div>
                </div>

                <!-- Quantity Selector -->
                <div class="option-group">
                    <span class="option-label">Quantity</span>
                    <div class="quantity-selector">
                        <button class="qty-btn">-</button>
                        <input type="text" value="1" class="qty-input" readonly>
                        <button class="qty-btn">+</button>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="product-actions">
                <button class="btn add-to-cart">Add to Cart</button>
                <button class="btn buy-now">Buy Now</button>
            </div>
        </div>
    </div>

</body>
</html>
